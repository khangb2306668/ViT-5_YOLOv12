# Six-class ViT-5-Small + YOLO12n hybrid for Ultralytics 8.4.185.
# P3 is already scaled to nano width inside ViT5HybridBackbone. Index outputs
# declare their actual channels; the original YOLO12n neck still uses n scaling.
nc: 6
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, ViT5HybridBackbone, []] # 0: [P3, P4, P5]
  - [0, 1, Index, [128, 0]]        # 1: P3/8
  - [0, 1, Index, [128, 1]]        # 2: P4/16
  - [0, 1, Index, [256, 2]]        # 3: P5/32

# Module types, repeats, and arguments below match the official YOLO12n head.
# Only references to backbone and head outputs have been remapped.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 4
  - [[-1, 2], 1, Concat, [1]]                   # 5: backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]           # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 7
  - [[-1, 1], 1, Concat, [1]]                   # 8: backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]           # 9: Detect P3

  - [-1, 1, Conv, [256, 3, 2]]                 # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11: head P4
  - [-1, 2, A2C2f, [512, False, -1]]           # 12: Detect P4

  - [-1, 1, Conv, [512, 3, 2]]                 # 13
  - [[-1, 3], 1, Concat, [1]]                   # 14: backbone P5
  - [-1, 2, C3k2, [1024, True]]               # 15: Detect P5

  - [[9, 12, 15], 1, Detect, [nc]]             # 16: Detect(P3, P4, P5)
