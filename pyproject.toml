[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vit5-yolo12"
version = "0.1.0"
description = "Dataset and experiment contract for a ViT-5/YOLO12n hybrid detector"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6,<7",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "torch>=2.4,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
train = ["ultralytics==8.4.185"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
